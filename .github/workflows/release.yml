name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: npm run typecheck

      - name: Build Windows artifacts
        run: npm run dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Vault ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Install Vault on Windows

            1. Download **[Vault-Setup-${{ steps.version.outputs.version }}.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Vault-Setup-${{ steps.version.outputs.version }}.exe)** from the **Assets** list below.
            2. Run the file and follow the installer. You can choose the install folder.
            3. Launch **Vault** from the Start Menu.

            That is the whole process. `Vault-Portable-${{ steps.version.outputs.version }}.exe` runs without installing, and the `latest.yml` / `*.blockmap` files are auto-update metadata that you do not need.

            > Windows SmartScreen may warn that the app is unrecognized because the builds are not code-signed yet. Choose **More info → Run anyway**.

            ---

            ## What's changed
          files: |
            release/Vault-Setup-*.exe
            release/Vault-Portable-*.exe
            release/*.blockmap
            release/latest.yml
          fail_on_unmatched_files: false
